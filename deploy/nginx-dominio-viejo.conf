# El dominio anterior, ya en desuso.
#
# Vive en /etc/nginx/sites-available/dominio-viejo. No sirve nada:
# manda todo a https://mercamaquinarias.com con un 301 permanente,
# para que ningún enlace que ande por ahí muera. Nadie ve el nombre
# viejo: el navegador cambia de dirección antes de pintar nada.
#
# Es temporal. Cuando el dominio anterior caduque, o antes si se
# prefiere, se quita entero:
#
#   rm /etc/nginx/sites-enabled/dominio-viejo
#   rm /etc/nginx/sites-available/dominio-viejo
#   certbot delete --cert-name tuequipord.com
#   systemctl reload nginx
#
# El bloque 443 hace falta: sin certificado, quien llegue por https
# vería un aviso de seguridad del navegador en vez de la redirección.

server {
    listen 80;
    listen [::]:80;
    server_name tuequipord.com www.tuequipord.com;
    return 301 https://mercamaquinarias.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tuequipord.com www.tuequipord.com;

    ssl_certificate /etc/letsencrypt/live/tuequipord.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tuequipord.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://mercamaquinarias.com$request_uri;
}
