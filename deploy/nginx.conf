# nginx para TuEquipoRD.
# Instalar en /etc/nginx/sites-available/tuequipord y enlazar a
# sites-enabled. Ya viene con el dominio real puesto.
#
# Este archivo es la versión SOLO HTTP, para el primer arranque.
# Certbot lo reescribe al añadir el certificado: crea el bloque 443
# y deja este redirigiendo a HTTPS. No hace falta editarlo a mano.

# El dominio viejo y el www mandan a la dirección canónica con un 301,
# para no perder enlaces ni posicionamiento. Quitar tuequipord.com de
# aquí si ese dominio deja de apuntar a este servidor.
server {
    listen 80;
    listen [::]:80;
    server_name www.mercamaquinarias.com tuequipord.com www.tuequipord.com;
    return 301 https://mercamaquinarias.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mercamaquinarias.com;

    server_tokens off;

    # Subida de fotos de equipos: el límite por defecto (1 MB) se queda corto.
    client_max_body_size 12M;

    # Comprimir lo que se sirve en texto. styles.css ronda los 90 KB
    # y app.js los 65 KB; comprimidos bajan a una fracción.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Fotografías de los anuncios, servidas por nginx directamente.
    #
    # Podrían pasar por Node —lo sabe hacer y pone las mismas
    # cabeceras—, pero cada foto ocuparía un ciclo del proceso que
    # atiende la API. nginx las sirve con sendfile sin despeinarse, y
    # el catálogo es justo la pantalla que pide veinticuatro a la vez.
    #
    # El nombre de cada archivo es aleatorio y nunca se reescribe, así
    # que `immutable` es cierto: una foto descargada no hay que volver
    # a pedirla jamás.
    location /fotos/ {
        alias /var/lib/tuequipord/fotos/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # El servidor lee X-Forwarded-For para los límites por origen.
        # Sin esto vería a nginx como único cliente y limitaría a todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_read_timeout 60s;
    }
}
