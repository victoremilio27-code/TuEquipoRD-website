# nginx para TuEquipoRD.
# Instalar en /etc/nginx/sites-available/tuequipord y enlazar a
# sites-enabled. Ya viene con el dominio real puesto.
#
# Este archivo es la versión SOLO HTTP, para el primer arranque.
# Certbot lo reescribe al añadir el certificado: crea el bloque 443
# y deja este redirigiendo a HTTPS. No hace falta editarlo a mano.

server {
    listen 80;
    listen [::]:80;
    server_name tuequipord.com www.tuequipord.com;

    # Subida de fotos de equipos: el límite por defecto (1 MB) se queda corto.
    client_max_body_size 12M;

    # Comprimir lo que se sirve en texto. styles.css ronda los 90 KB
    # y app.js los 65 KB; comprimidos bajan a una fracción.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # El servidor lee X-Forwarded-For para los límites por origen.
        # Sin esto vería a nginx como único cliente y limitaría a todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_read_timeout 60s;
    }
}
